services:

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - app-network

  php:
    build:
      context: .
      dockerfile: app/Dockerfile
    restart: always
    volumes:
      - ./:/var/www/html
      - vendor_data:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Surcharge DB_HOST du .env (127.0.0.1, prévu pour du PHP hors Docker)
      # par le nom du service Docker, uniquement pour ce conteneur.
      DB_HOST: db
    networks:
      - app-network

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: reservation_salles
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"   # correspond à DB_PASSWORD= vide dans .env.example
      # Pour un usage plus sérieux (recommandé dès que possible),
      # remplace par MYSQL_ROOT_PASSWORD et mets à jour .env en conséquence.
    ports:
      - "3306:3306"        # utile pour se connecter avec un client externe (TablePlus, DBeaver...)
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
  vendor_data: