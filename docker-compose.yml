services:

  # nginx:
  #   image: nginx:alpine
  #   restart: always
  #   ports:
  #     - "${APP_PORT}:80"
  #   volumes:
  #     - ./:/var/www/html
  #     - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
  #   depends_on:
  #     - php
  #   networks:
  #     - app-network

  php:
    build:
      context: .
      dockerfile: app/Dockerfile
    restart: always
    ports:
      - "${APP_PORT}:8000" 
    volumes:
      - ./:/var/www/html
      - vendor_data:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # DB_HOST reste "db" en dur volontairement : ce n'est pas une valeur
      # de config qui varie (mot de passe, port...), c'est le NOM DU SERVICE
      # Docker lui-même, tel que défini juste au-dessus (db:). Le mettre en
      # variable n'aurait pas de sens : ce nom est fixé par la structure
      # de ce fichier, pas par l'environnement d'exécution.
      DB_HOST: db
    networks:
      - app-network

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_ALLOW_EMPTY_PASSWORD: ${MYSQL_ALLOW_EMPTY_PASSWORD}
    ports:
      - "${DB_EXPOSED_PORT}:3306"        # utile pour se connecter avec un client externe (TablePlus, DBeaver...)
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  # phpmyadmin:
  #   image: phpmyadmin:latest
  #   restart: always
  #   ports:
  #     - "8081:80"
  #   environment:
  #     PMA_HOST: db
  #   depends_on:
  #     - db
  #   networks:
  #     - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
  vendor_data:

  